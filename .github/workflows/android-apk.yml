
name: Build Android Testing APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate Testing APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v7

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install npm packages
      - name: Install dependencies
        run: npm ci

      # 6. Verify Android project files
      - name: Verify Android project
        run: |
          echo "Project root:"
          pwd

          echo "Android directory:"
          ls -la android/

          echo "Gradle wrapper:"
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle

          echo "Android project verification successful"

      # 7. Restore debug keystore from GitHub Secret
      - name: Restore Android debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub keystore secret is empty or missing"
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > android/app/debug.keystore

          test -s android/app/debug.keystore

          echo "Debug keystore restored successfully"

      # 8. Build Android release APK
      - name: Build release APK
        run: |
          chmod +x android/gradlew

          android/gradlew \
            -p android \
            assembleRelease \
            --no-daemon \
            --stacktrace

      # 9. Verify APK
      - name: Verify generated APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            find android/app/build/outputs -type f
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # 10. Upload APK artifact
      - name: Upload Android Testing APK
        uses: actions/upload-artifact@v7
        with:
          name: Microfinance-Testing-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
